<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve's Secret Controller</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1e1e19; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; color: white; }
        .card { background: #26261f; padding: 30px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid #3d3d32; }
        h1 { font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.1em; color: #fdf0e6; }
        .mode-list { display: flex; flex-direction: column; gap: 12px; }
        button { border: none; padding: 18px; font-size: 15px; font-weight: 700; border-radius: 12px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.96); }
        .btn-honest { background: #3c5e8b; color: white; margin-bottom: 8px; }
        .btn-attack { background: #a15b4e; color: white; }
        .btn-active { border: 2px solid #fff; box-shadow: 0 0 12px rgba(255,255,255,0.3); }
        #status { margin-top: 24px; font-family: monospace; color: #9c9c8d; font-size: 14px; background: #1e1e19; padding: 12px; border-radius: 8px;}
    </style>
</head>
<body>
    <div class="card">
        <h1>God Mode Controller</h1>
        
        <div class="mode-list">
            <button class="btn-honest" id="btn-HONEST" onclick="setMode('HONEST')">🟢 Honest Protocol</button>
            <button class="btn-attack" id="btn-INDIVIDUAL" onclick="setMode('INDIVIDUAL')">🔴 Intercept-Resend (Individual)</button>
            <button class="btn-attack" id="btn-COLLECTIVE" onclick="setMode('COLLECTIVE')">🔴 Entanglement (Collective)</button>
            <button class="btn-attack" id="btn-COHERENT" onclick="setMode('COHERENT')">🔴 Joint Probe (Coherent)</button>
            <button class="btn-attack" id="btn-IMPERSONATION" onclick="setMode('IMPERSONATION')">🔴 Impersonation / Forgery</button>
            <button class="btn-attack" id="btn-CHANNEL_MANIPULATION" onclick="setMode('CHANNEL_MANIPULATION')">🔴 Classical Manipulation</button>
            <button class="btn-attack" id="btn-REPLAY" onclick="setMode('REPLAY')">🔴 Replay Attack</button>
        </div>
        
        <div id="status">Current Mode: Unknown</div>
    </div>

    <script>
        async function setMode(mode) {
            try {
                await fetch('/api/set_attack', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: mode })
                });
                updateUI(mode);
            } catch (e) {
                alert("Error setting mode.");
            }
        }

        function updateUI(activeMode) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('btn-active'));
            const activeBtn = document.getElementById('btn-' + activeMode);
            if (activeBtn) activeBtn.classList.add('btn-active');
            
            document.getElementById('status').innerText = 'Active: ' + activeMode;
        }
        
        // Fetch initial status
        async function fetchStatus() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                updateUI(data.attack_mode || 'HONEST');
            } catch (e) {}
        }
        
        fetchStatus();
        setInterval(fetchStatus, 2000);
    </script>
</body>
</html>
