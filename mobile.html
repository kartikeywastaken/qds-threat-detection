<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob's Terminal - QDS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f6f3ec; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 320px; border: 1px solid #e3ddd0; }
        h1 { font-size: 18px; color: #26261f; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 0.05em; }
        button { background: #3c5e8b; color: white; border: none; padding: 20px; font-size: 14px; font-weight: 700; border-radius: 12px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        #result { margin-top: 30px; padding: 20px; border-radius: 12px; font-weight: bold; font-size: 14px; display: none; line-height: 1.5; }
        .success { background: #eaf1eb; color: #2f5c3d; border: 2px solid #4f7f5c; }
        .error { background: #fde8e4; color: #a15b4e; border: 2px solid #a15b4e; }
        .loader { margin: 10px auto; width: 24px; height: 24px; border: 3px solid #f3f3f3; border-top: 3px solid #3c5e8b; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bob's Terminal</h1>
        <p style="font-size:12px; color:#6b6b5e; margin-bottom:24px;">Quantum Post-Transfer Verification</p>
        <button id="verifyBtn" onclick="verifyTransfer()">Verify Incoming Transfer</button>
        <div id="loader" class="loader"></div>
        <div id="result"></div>
    </div>

    <script>
        async function verifyTransfer() {
            const btn = document.getElementById('verifyBtn');
            const resDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            
            btn.style.display = "none";
            loader.style.display = "block";
            resDiv.style.display = "none";

            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                
                setTimeout(() => {
                    btn.style.display = "block";
                    loader.style.display = "none";
                    btn.innerHTML = "Verify Another Transfer";
                    resDiv.style.display = "block";
                    
                    if (state.latest_decision === 'REJECT') {
                        resDiv.className = 'error';
                        resDiv.innerHTML = "⚠ FORGERY DETECTED!<br><br>The payload was mathematically tampered with by Eve in transit.";
                    } else {
                        resDiv.className = 'success';
                        resDiv.innerHTML = "✓ SIGNATURE INTACT<br><br>Transfer Verified. Funds secured.";
                    }
                }, 1200); // 1.2s Artificial delay for suspense
            } catch (e) {
                alert("Error connecting to QDS backend.");
                btn.style.display = "block";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
